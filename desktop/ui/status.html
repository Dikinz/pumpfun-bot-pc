<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Состояние · PAPER</title><style>
:root{--bg:#0b0e11;--panel:#12161c;--panel2:#161b22;--line:#222a35;--line2:#2c3542;--tx:#e6e8eb;--tx2:#aab2bd;--mut:#8a93a0;--acc:#8b9cff;--up:#2ebd85;--dn:#f6465d;--warn:#f0b90b;--acc-bg:rgba(139,156,255,.12);--up-bg:rgba(46,189,133,.12);--dn-bg:rgba(246,70,93,.12);--warn-bg:rgba(240,185,11,.12);--sans:"Segoe UI",system-ui,Arial,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 var(--sans)}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top b{font-size:14px}.ver{color:var(--mut);font-family:var(--mono);font-size:12px}
.paper{background:var(--acc-bg);color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:1px 8px;font-size:11px;font-weight:600}
.sp{flex:1}.dev{color:var(--warn);font-weight:600;font-size:11px}
main{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;max-width:1200px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.p{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.p.w{grid-column:1/-1}
h2{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.state{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mut);flex:none}
.dot.green{background:var(--up)}.dot.yellow{background:var(--warn)}.dot.red{background:var(--dn)}
.sub{color:var(--tx2);margin-top:4px}
.ban{padding:8px 12px;border-radius:6px;border:1px solid;white-space:pre-wrap}
.ban.r{background:var(--dn-bg);color:var(--dn);border-color:var(--dn)}.ban.a{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.ban.i{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}.ban.g{background:var(--up-bg);color:var(--up);border-color:var(--up)}
.bans{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}.bans:empty{display:none}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0}
dt{color:var(--mut)}dd{margin:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--up);border-color:var(--up);color:#0b0e11;font-weight:600}
button.dan{background:var(--dn-bg);border-color:var(--dn);color:var(--dn);font-weight:600}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
ol.steps li{display:flex;gap:8px;align-items:baseline;color:var(--mut)}
ol.steps li::before{content:"○";width:14px;flex:none}
ol.steps li.on{color:var(--tx)}ol.steps li.on::before{content:"●";color:var(--up)}
ol.steps li.cur{color:var(--warn)}ol.steps li.cur::before{content:"◐";color:var(--warn)}
ol.steps li.bad{color:var(--dn)}ol.steps li.bad::before{content:"✕";color:var(--dn)}
.timer{font-family:var(--mono);color:var(--tx2);margin-top:8px;white-space:pre-wrap}
pre{margin:8px 0 0;max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;font:11.5px/1.4 var(--mono);color:var(--tx2);white-space:pre-wrap}
.hide{display:none!important}.mut{color:var(--mut)}
</style></head><body>
<div class="top"><b>PumpFun</b><span class="paper">PAPER</span><span class="ver" id="ver">—</span><span class="sp"></span><span class="dev hide" id="dev">DEV</span></div>
<main>
<div class="bans" id="bans"></div>
<section class="p"><h2>Состояние</h2>
 <div class="state"><span class="dot" id="dot"></span><span id="stx">загрузка…</span></div>
 <div class="sub" id="ssub"></div>
</section>
<section class="p"><h2>Прошлый запуск</h2>
 <dl id="last"><dt>Фаза</dt><dd>—</dd></dl>
</section>
<section class="p w hide" id="pStart"><h2>Запуск</h2>
 <ol class="steps" id="startSteps"></ol><div class="timer" id="startTimer"></div>
 <div class="ban r hide" id="startMsg"></div><pre class="hide" id="startTail"></pre>
</section>
<section class="p w hide" id="pStop"><h2>Остановка</h2>
 <ol class="steps" id="stopSteps"></ol><div class="timer" id="stopTimer"></div>
 <div class="ban hide" id="stopMsg"></div>
</section>
<section class="p w"><h2>Действия</h2>
 <div class="btns">
  <button class="pri" id="bStart" data-api="start" data-act="start">Запустить</button>
  <button class="dan" id="bStop" data-api="stop" data-act="stop">Остановить…</button>
  <button id="bTerm" data-api="show_terminal" data-act="show_terminal">Терминал</button>
  <button data-api="run_results" data-act="results">Результаты (05)</button>
  <button data-api="run_check" data-act="check">Проверка (04)</button>
  <button data-api="open_settings" data-act="settings">Настройки (02)</button>
  <button data-api="open_preserve" data-act="preserve">Сохранить данные (08)</button>
  <button data-api="open_results_folder" data-act="open_results">Папка results</button>
  <button data-api="open_logs" data-act="open_logs">Папка журналов</button>
 </div>
 <div class="ban hide" id="actMsg" style="margin-top:10px"></div>
</section>
<section class="p w hide" id="pAction"><h2>Фоновое действие</h2>
 <dl id="action"></dl>
</section>
</main>
<script>
"use strict";
var S=null,busyCall=false,note=null;
function $(id){return document.getElementById(id)}
function api(){return window.pywebview&&window.pywebview.api?window.pywebview.api:null}
function show(el,on){el.classList.toggle("hide",!on)}
function fmtTs(t){if(t===null||t===undefined||t==="")return "—";var d=new Date(Number(t)*1000);return isNaN(d.getTime())?String(t):d.toLocaleString("ru-RU")}
function fmtS(s){s=Math.max(0,Math.floor(Number(s)||0));var m=Math.floor(s/60);return (m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60)}
function dl(el,rows){el.textContent="";rows.forEach(function(r){if(r[1]===null||r[1]===undefined||r[1]==="")return;var dt=document.createElement("dt");dt.textContent=r[0];var dd=document.createElement("dd");dd.textContent=String(r[1]);el.appendChild(dt);el.appendChild(dd)})}
function steps(el,items){el.textContent="";items.forEach(function(it){var li=document.createElement("li");li.textContent=it[0];if(it[1])li.className=it[1];el.appendChild(li)})}
function banner(cls,text){var d=document.createElement("div");d.className="ban "+cls;d.textContent=text;$("bans").appendChild(d)}
function render(s){
 S=s;if(!s)return;
 document.title=s.title||"Состояние · PAPER";
 $("ver").textContent=s.version||"версия неизвестна";
 show($("dev"),!!s.dev);
 $("dot").className="dot "+(s.tray||"grey");
 $("stx").textContent=s.text||s.kind;
 var sub=s.kind;if(s.busy)sub+=" · идёт: "+s.busy;if(s.port)sub+=" · панель 127.0.0.1:"+s.port;$("ssub").textContent=sub;
 $("bans").textContent="";
 if(s.dev_text)banner("a",s.dev_text);
 if(s.lost)banner("r",s.lost+(s.lost_acked?" (подтверждено)":""));
 if(s.orphan)banner("r",s.orphan);
 if(s.self_stop)banner("r",s.self_stop);
 if(s.kind==="EXTERNAL_FOREIGN"&&s.allowed&&s.allowed.start)banner("r",s.allowed.start[1]||"");
 if(s.kind==="EXTERNAL_SAME")banner("i","Бот запущен через 03_START.bat. Остановка — Ctrl+C в окне 03_START.");
 if(s.warning)banner("a",s.warning);
 var l=s.last||{};
 dl($("last"),[["Фаза",l.phase||"нет данных"],["Код",l.exit_code],["Ошибка",l.error_code],["Начало",l.started_ts?fmtTs(l.started_ts):null],["Конец",l.finished_ts?fmtTs(l.finished_ts):null],["Журнал",l.log_name]]);
 renderStart(s.start);renderStop(s.stop);renderAction(s.action);
 var a=s.allowed||{};
 document.querySelectorAll("button[data-act]").forEach(function(b){var r=a[b.dataset.act];var ok=!r||r[0];b.disabled=busyCall||!ok;b.title=ok?"":(r[1]||"")});
 var lost=s.kind==="ENGINE_LOST"&&!s.lost_acked;
 $("bStart").textContent=lost?"Подтвердить предупреждение…":"Запустить";if(lost)$("bStart").disabled=busyCall;
 show($("bTerm"),!!(a.show_terminal&&a.show_terminal[0]));
}
function renderStart(op){
 show($("pStart"),!!op&&(!op.done||!op.ok));if(!op)return;
 var ph=op.phase,order=["PREFLIGHT","STARTING","RUNNING"],i=order.indexOf(ph),bad=op.done&&!op.ok;
 var items=[["Хост движка запущен",ph||op.done?"on":"cur"],["Проверка перед запуском (PREFLIGHT)",i>0?"on":i===0?"cur":""],["Запуск процессов (STARTING)",i>1?"on":i===1?"cur":""],["Движок работает (RUNNING)",i>=2?"on":""],["Панель отвечает (/health)",op.health_ok?"on":i>=2?"cur":""]];
 if(bad)for(var k=items.length-1;k>=0;k--){if(items[k][1]!=="on"){items[k][1]="bad";break}}
 steps($("startSteps"),items);$("startTimer").textContent="Прошло "+fmtS(op.elapsed)+(op.done?"":" (обычно до 02:00)");
 var slow=!op.done&&!!op.slow;show($("startMsg"),bad||slow);$("startMsg").className="ban "+(bad?"r":"a")+(bad||slow?"":" hide");$("startMsg").textContent=op.message||"";
 show($("startTail"),bad&&!!op.log_tail);$("startTail").textContent=op.log_tail||"";
}
function renderStop(op){
 show($("pStop"),!!op);if(!op)return;
 var fin=op.done?(op.ok?"on":"bad"):"";
 steps($("stopSteps"),[["Запрос остановки записан",op.requested?"on":"cur"],["Движок принял (STOP_REQUESTED)",op.accepted?"on":op.requested?"cur":""],["Панель остановлена",op.panel_down?"on":op.accepted?"cur":""],["Итог: "+(op.done?("код "+(op.exit_code===null||op.exit_code===undefined?"нет":op.exit_code)):"ожидание"),op.done?fin:op.panel_down?"cur":""]]);
 $("stopTimer").textContent="Прошло "+fmtS(op.elapsed)+(op.audit?"\n"+op.audit:"");
 var m=$("stopMsg");show(m,!!op.message);m.className="ban "+(op.done?(op.ok?"g":"r"):op.slow?"a":"i")+(op.message?"":" hide");m.textContent=op.message||"";
}
function renderAction(a){
 show($("pAction"),!!a);if(!a)return;
 var names={results:"Результаты (05)",check:"Проверка (04)"};
 dl($("action"),[["Действие",names[a.kind]||a.kind],["Состояние",a.done?(a.status||"")+" (код "+a.code+")":"выполняется, "+fmtS(a.elapsed)],["Итог",a.done?a.text:null],["Папка результатов",a.evidence],["Журнал",a.log]]);
}
function call(name){
 var p=api();if(!p||busyCall)return;busyCall=true;render(S);
 p[name]().then(function(r){busyCall=false;if(r&&r.status)render(r.status);else render(S);
  var m=$("actMsg");if(r&&r.message){m.className="ban "+(r.ok?"g":"r");m.textContent=r.message}else{m.className="ban hide";m.textContent=""}
 }).catch(function(e){busyCall=false;render(S);var m=$("actMsg");m.className="ban r";m.textContent=String(e&&e.message||e)});
}
document.querySelectorAll("button[data-api]").forEach(function(b){b.addEventListener("click",function(){call(b.dataset.api)})});
function poll(){var p=api();if(!p)return;p.get_status().then(render).catch(function(){})}
window.addEventListener("pywebviewready",function(){poll()});
setInterval(poll,2000);poll();
</script></body></html>
