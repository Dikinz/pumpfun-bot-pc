const key=S.tab+'|'+S.branch+'|'+JSON.stringify(tabIn(S.tab));if(!force&&key===S.tabKey)return;S.tabKey=key;const tb=$('tb'),st=tb.scrollTop;safe('tb',TF[S.tab]);tb.scrollTop=st}

try{rTop()}catch(e){}try{rBans()}catch(e){}

kset('kpi',[br,b],rKpi);try{rBbar()}catch(e){console.warn(e)}

kset('pCap',[br,b&&[b.capital,b.gross,b.new_closed,b.carried_closed],g(O,'campaign.start_balance'),P?[ag,aOld()]:0],rCap);

function maybe(){const k=[g(S.O,'generated_ts'),g(S.A,'as_of'),g(S.A,'generated_ts'),g(S.H,'version'),conn(),aLate(),aOld(),g(S.O,'primary.runtime.frozen'),S.branch,S.tab].join('|');if(k!==S.key){S.key=k;render()}else{rStatus();if(conn()==='lost'||(S.A&&aOld()))rBans()}}
async function get(path,t){const c=new AbortController(),tm=setTimeout(()=>c.abort(),t);try{const r=await fetch(path,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}}
const EP={O:['/overview',6000,3000],A:['/api',12000,15000],H:['/health',8000,30000]};
const retryS=()=>Math.max(1,Math.round((S.next.O-Date.now())/1000));
async function poll(k){if(S.inf[k])return;S.inf[k]=1;S.next[k]=Date.now()+EP[k][2];
try{const d=await get(EP[k][0],EP[k][1]);S[k]=d;S.ec[k]=0;if(k==='O'){S.okO=Date.now();S.errO=false;S.everO=true}else if(k==='A'){S.okA=Date.now();S.errA=false}
if(k!=='H'&&S.H&&d&&d.version&&d.version!==S.H.version&&!S.vmc){S.vmc=1;S.next.H=0}}
catch(e){S.ec[k]=Math.min((S.ec[k]||0)+1,10);S.next[k]=Date.now()+Math.min(EP[k][2]*2**S.ec[k],60000);if(k==='O')S.errO=true;else if(k==='A')S.errA=true}finally{S.inf[k]=0;maybe()}}
function force(){const n=Date.now();if(S.demo||n-S.lastForce<5000)return;S.lastForce=n;if(!S.ec.O)S.next.O=0;if(!S.ec.A&&n-(S.okA||0)>=15000)S.next.A=0;tick()}
function tick(){if(S.demo){rStatus();return}if(!document.hidden){const n=Date.now();for(const k of ['O','A','H'])if(n>=S.next[k])poll(k)}maybe()}

catch(e){if(location.protocol!=='file:'){S.demo=null;S.O=S.A=null;S.everO=false;S.key='';render();tick();return}$('st').innerHTML='<span class=dn>демо-образцы не найдены</span>'}maybe()}

function setTab(t){S.tab=t;try{localStorage.setItem('pfterm.tab',String(t))}catch(e){}rTabs(true);S.key='';maybe()}
$('tn').addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'&&e.key!=='Home'&&e.key!=='End')return;e.preventDefault();const n=TABS.length;
const t=e.key==='Home'?0:e.key==='End'?n-1:(S.tab+(e.key==='ArrowRight'?1:n-1))%n;setTab(t);const x=$('tab'+t);if(x)x.focus()});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||(e.target&&e.target.isContentEditable))return;
const k=e.key.toLowerCase();if(e.shiftKey){if(k==='d'||k==='в')location.href='/details';return}
if(k>='1'&&k<='6'){setTab(+k-1)}else if(k==='b'||k==='и'){const en=BR.map(x=>x[0]).filter(enabled);setBranch(en[(en.indexOf(S.branch)+1)%en.length])}
else if(k==='r'||k==='к'){force()}});

try{const b=localStorage.getItem('pfterm.branch');if(b&&BR.some(x=>x[0]===b))S.branch=b;const t=parseInt(localStorage.getItem('pfterm.tab'),10);if(t>=0&&t<6)S.tab=t}catch(e){}
